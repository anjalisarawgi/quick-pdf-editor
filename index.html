<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Editor</title>
<style>
  :root { --bg:#f4f5f7; --panel:#fff; --line:#d9dce1; --text:#1c1e21; --accent:#2f6fed; --muted:#6b7280; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1b1c1f; --panel:#26282c; --line:#3a3d43; --text:#e8e9ec; --accent:#6c9bff; --muted:#9aa0a9; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:14px system-ui, sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
  header { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--line); }
  header .sep { width:1px; height:24px; background:var(--line); margin:0 4px; }
  button, label.btn { font:inherit; padding:6px 12px; border:1px solid var(--line); background:var(--panel); color:var(--text); border-radius:6px; cursor:pointer; }
  button:hover:not(:disabled), label.btn:hover { border-color:var(--accent); }
  button:disabled { opacity:.4; cursor:default; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  input[type=number] { width:60px; padding:5px; }
  input[type=text] { padding:5px; }
  main { flex:1; display:flex; min-height:0; }
  #thumbs { width:160px; overflow-y:auto; background:var(--panel); border-right:1px solid var(--line); padding:8px; }
  .thumb { margin-bottom:10px; cursor:pointer; text-align:center; font-size:12px; color:var(--muted); }
  .thumb canvas { max-width:100%; height:auto; border:2px solid var(--line); background:#fff; display:block; margin:0 auto 2px; }
  .thumb.active canvas { border-color:var(--accent); }
  #viewer { flex:1; overflow:auto; padding:16px; text-align:center; }
  #pageWrap { position:relative; display:inline-block; box-shadow:0 2px 12px rgba(0,0,0,.25); cursor:text; }
  #pageWrap canvas { display:block; background:#fff; }
  #empty { margin:auto; text-align:center; color:var(--muted); padding:40px; }
  #drop { border:2px dashed var(--line); border-radius:12px; padding:40px 60px; }
  #drop.over { border-color:var(--accent); }
  #status { margin-left:auto; color:var(--muted); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <label class="btn primary">Open PDF<input id="file" type="file" accept="application/pdf" hidden></label>
  <label class="btn" id="mergeBtn">Append PDF<input id="mergeFile" type="file" accept="application/pdf" hidden></label>
  <button id="undo" disabled>Undo</button>
  <span class="sep"></span>
  <button id="rotL" disabled>⟲ Rotate</button>
  <button id="rotR" disabled>⟳ Rotate</button>
  <button id="up" disabled>↑ Move up</button>
  <button id="down" disabled>↓ Move down</button>
  <button id="del" disabled>Delete page</button>
  <span class="sep"></span>
  <select id="mode" title="What clicking the page does">
    <option value="edit">Edit existing text</option>
    <option value="add">Add new text</option>
  </select>
  <input id="textSize" type="number" value="16" min="6" max="96" title="Font size">
  <input id="textColor" type="color" value="#000000" title="Colour">
  <span id="status"></span>
  <button id="save" class="primary" disabled>Download PDF</button>
</header>
<main>
  <div id="thumbs"></div>
  <div id="viewer">
    <div id="empty"><div id="drop">Drop a PDF here, or use <b>Open PDF</b></div></div>
    <div id="pageWrap" hidden><canvas id="page"></canvas></div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const { PDFDocument, StandardFonts, rgb, degrees } = PDFLib;
const $ = id => document.getElementById(id);

let bytes = null;       // current PDF (source of truth)
let pdfDoc = null;      // pdf.js doc of `bytes`
let current = 0;        // selected page index
let history = [];       // previous `bytes` values
let viewport = null;
const SCALE = 1.75;

const setStatus = t => $("status").textContent = t;
const hexToRgb = h => rgb(...[1,3,5].map(i => parseInt(h.slice(i, i+2), 16) / 255));

async function load(newBytes, keepPage = false) {
  bytes = newBytes;
  pdfDoc = await pdfjsLib.getDocument({ data: bytes.slice() }).promise;
  current = keepPage ? Math.min(current, pdfDoc.numPages - 1) : 0;
  $("empty").hidden = true;
  $("pageWrap").hidden = false;
  await Promise.all([renderThumbs(), renderPage()]);
  updateButtons();
}

async function renderPage() {
  const page = await pdfDoc.getPage(current + 1);
  const dpr = window.devicePixelRatio || 1;
  viewport = page.getViewport({ scale: SCALE * dpr });   // render at device resolution
  const c = $("page");
  c.width = viewport.width; c.height = viewport.height;
  c.style.width = viewport.width / dpr + "px";           // but display at CSS size
  c.style.height = viewport.height / dpr + "px";
  await page.render({ canvasContext: c.getContext("2d"), viewport }).promise;
  document.querySelectorAll(".thumb").forEach((t, i) => t.classList.toggle("active", i === current));
}

async function renderThumbs() {
  const box = $("thumbs");
  box.innerHTML = "";
  for (let i = 0; i < pdfDoc.numPages; i++) {
    const page = await pdfDoc.getPage(i + 1);
    const dpr = window.devicePixelRatio || 1;
    const vp = page.getViewport({ scale: 0.25 * dpr });
    const div = document.createElement("div");
    div.className = "thumb";
    const c = document.createElement("canvas");
    c.width = vp.width; c.height = vp.height;
    c.style.width = vp.width / dpr + "px";
    div.append(c, String(i + 1));
    div.onclick = () => { current = i; renderPage(); updateButtons(); };
    box.append(div);
    page.render({ canvasContext: c.getContext("2d"), viewport: vp });
  }
}

function updateButtons() {
  const has = !!pdfDoc, n = pdfDoc ? pdfDoc.numPages : 0;
  for (const id of ["save", "rotL", "rotR"]) $(id).disabled = !has;
  $("undo").disabled = !history.length;
  $("up").disabled = !has || current === 0;
  $("down").disabled = !has || current >= n - 1;
  $("del").disabled = !has || n <= 1;
  setStatus(has ? `Page ${current + 1} / ${n}` : "");
}

// Apply an edit with pdf-lib, keep undo history, reload.
async function edit(fn, { page = current, keepPage = true } = {}) {
  const doc = await PDFDocument.load(bytes);
  await fn(doc);
  const out = await doc.save();
  history.push(bytes);
  if (history.length > 30) history.shift();
  current = page;
  await load(out, keepPage);
}

async function readFile(file) { return new Uint8Array(await file.arrayBuffer()); }

async function openFile(file) {
  if (!file || file.type !== "application/pdf") return setStatus("Not a PDF file");
  try { history = []; await load(await readFile(file)); }
  catch (e) { setStatus("Could not open PDF: " + e.message); }
}

$("file").onchange = e => { openFile(e.target.files[0]); e.target.value = ""; };

$("mergeFile").onchange = async e => {
  const file = e.target.files[0]; e.target.value = "";
  if (!file) return;
  if (!bytes) return openFile(file);
  const other = await PDFDocument.load(await readFile(file));
  await edit(async doc => {
    const pages = await doc.copyPages(other, other.getPageIndices());
    pages.forEach(p => doc.addPage(p));
  });
};

$("undo").onclick = async () => { if (history.length) await load(history.pop(), true); };

const rotate = delta => edit(doc => {
  const p = doc.getPage(current);
  p.setRotation(degrees((p.getRotation().angle + delta + 360) % 360));
});
$("rotL").onclick = () => rotate(-90);
$("rotR").onclick = () => rotate(90);

$("del").onclick = () => edit(doc => doc.removePage(current), { page: Math.max(0, current - 1) });

const move = dir => edit(doc => {
  const p = doc.getPage(current);
  doc.removePage(current);
  doc.insertPage(current + dir, p);
}, { page: current + dir });
$("up").onclick = () => move(-1);
$("down").onclick = () => move(1);

// Find the vertical cell borders left/right of a text run by scanning rendered pixels.
// Returns canvas-pixel x bounds; falls back to the page edges.
function cellBounds(ex, ey, hpx) {
  const c = $("page"), ctx = c.getContext("2d");
  const y0 = Math.max(0, Math.floor(ey - 0.8 * hpx)), y1 = Math.min(c.height, Math.ceil(ey + 0.2 * hpx));
  if (y1 <= y0) return { left: 0, right: c.width };
  const { data, width } = ctx.getImageData(0, y0, c.width, y1 - y0);
  const rows = y1 - y0;
  const isBorder = x => {
    let dark = 0;
    for (let r = 0; r < rows; r++) {
      const i = (r * width + x) * 4;
      if (data[i] + data[i + 1] + data[i + 2] < 384) dark++;
    }
    return dark / rows >= 0.9;
  };
  let left = 0, right = c.width;
  for (let x = Math.floor(ex) - 1; x >= 0; x--) if (isBorder(x)) { left = x + 1; break; }
  for (let x = Math.ceil(ex); x < c.width; x++) if (isBorder(x)) { right = x; break; }
  return { left, right };
}

// Click on page: edit the existing text run under the cursor, or add new text.
$("page").addEventListener("click", async e => {
  if (!pdfDoc) return;
  const r = e.target.getBoundingClientRect();
  const x = (e.clientX - r.left) * (e.target.width / r.width);
  const y = (e.clientY - r.top) * (e.target.height / r.height);
  const [px, py] = viewport.convertToPdfPoint(x, y);
  const size = Number($("textSize").value) || 16;
  const color = hexToRgb($("textColor").value);

  let hit = null;
  if ($("mode").value === "edit") {
    const page = await pdfDoc.getPage(current + 1);
    const content = await page.getTextContent();
    for (const it of content.items) {
      if (!it.str.trim()) continue;
      const [a, b, , , ex, ey] = it.transform;
      const th = Math.atan2(b, a), h = it.height || Math.hypot(a, b);
      const dx = px - ex, dy = py - ey;
      const lx = dx * Math.cos(th) + dy * Math.sin(th);
      const ly = -dx * Math.sin(th) + dy * Math.cos(th);
      if (lx >= 0 && lx <= it.width && ly >= -0.25 * h && ly <= h) { hit = { it, th, h }; break; }
    }
    if (!hit) return setStatus("No text there. Click directly on a word (or switch to Add new text)");
  }

  const text = prompt(hit ? "Edit text:" : "Text to add:", hit ? hit.it.str : "");
  if (text === null || (!hit && !text)) return;

  try {
    await edit(async doc => {
      const font = await doc.embedFont(StandardFonts.Helvetica);
      const p = doc.getPage(current);
      if (hit) {
        const { it, th, h } = hit, [, , , , ex, ey] = it.transform;
        const deg = th * 180 / Math.PI;
        let x0 = ex - 1, x1 = ex + it.width + 1, maxW = Infinity;
        if (viewport.rotation === 0 && Math.abs(th) < 1e-3) {
          // Keep inside the cell so borders survive and text doesn't spill out.
          const [, , , , cx, cy] = pdfjsLib.Util.transform(viewport.transform, it.transform);
          const cell = cellBounds(cx, cy, h * viewport.scale);
          x0 = Math.max(x0, cell.left / viewport.scale + 1);
          x1 = Math.min(x1, cell.right / viewport.scale - 1);
          maxW = cell.right / viewport.scale - 1.5 - ex;
        }
        const c = Math.cos(th), s = Math.sin(th), oy = -0.2 * h;
        const ox = x0 - ex;
        p.drawRectangle({
          x: ex + ox * c - oy * s, y: ey + ox * s + oy * c,
          width: Math.max(0, x1 - x0), height: 1.05 * h,
          rotate: degrees(deg), color: rgb(1, 1, 1), borderWidth: 0,
        });
        if (text) {
          let size = h;
          const w = font.widthOfTextAtSize(text, size);
          if (w > maxW) size = size * maxW / w;   // shrink to fit the cell
          p.drawText(text, { x: ex, y: ey, size, font, color, rotate: degrees(deg) });
        }
      } else {
        // Counter-rotate so text reads upright on rotated pages.
        p.drawText(text, { x: px, y: py, size, font, color, rotate: degrees(p.getRotation().angle) });
      }
    });
  } catch (err) {
    setStatus("Could not write text: " + err.message);
  }
});

$("save").onclick = () => {
  const url = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
  const a = Object.assign(document.createElement("a"), { href: url, download: "edited.pdf" });
  a.click();
  URL.revokeObjectURL(url);
};

// Drag & drop
const drop = $("drop");
addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
addEventListener("dragleave", () => drop.classList.remove("over"));
addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); openFile(e.dataTransfer.files[0]); });
</script>
</body>
</html>
